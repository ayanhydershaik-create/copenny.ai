<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — copenny.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0B0B0B; color: #e2e8f0; font-family: 'Outfit', sans-serif; min-height: 100vh; }
    nav { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 1rem 2.5rem; background: rgba(6,11,20,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { height: 36px; }
    .nav-logo span { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .nav-back { color: #F59E0B; text-decoration: none; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
    .nav-back:hover { opacity: 0.7; }
    .hero { text-align: center; padding: 6rem 2rem 4rem; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(245,158,11,0.06) 0%, transparent 70%); }
    .badge { display: inline-block; background: rgba(245,158,11,0.08); border: 1px solid rgba(245,158,11,0.2); color: #F59E0B; padding: 0.35rem 1rem; border-radius: 999px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; color: #fff; margin-bottom: 1rem; }
    h1 span { color: #F59E0B; }
    .subtitle { max-width: 600px; margin: 0 auto; color: #94a3b8; font-size: 1.05rem; line-height: 1.7; }
    .content { max-width: 600px; margin: 0 auto; padding: 4rem 2rem 6rem; text-align: center; }
    .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; padding: 2.5rem; margin-bottom: 2rem; }
    a { color: #F59E0B; text-decoration: none; font-weight: 700; font-size: 1.2rem; }
    footer { text-align: center; padding: 2rem; border-top: 1px solid rgba(255,255,255,0.05); color: #475569; font-size: 0.8rem; }
  </style>
</head>
<body>
<nav>
  <a href="/landing" class="nav-logo">
    <img src="/static/iconcopenny.png" alt="Co Penny" />
    <span>copenny.ai</span>
  </a>
  <a href="/landing" class="nav-back">← Back to Home</a>
</nav>
<div class="hero">
  <div class="badge">Contact</div>
  <h1>Get in <span>Touch</span></h1>
  <p class="subtitle">Have questions or want to partner? We'd love to hear from you.</p>
</div>
<div class="content">
  <div class="card">
    <h2 style="color:#fff; margin-bottom:1rem;">Email Us</h2>
    <a href="mailto:hello@copenny.ai">hello@copenny.ai</a>
    <p style="margin-top:1rem; color:#94a3b8; font-size:0.9rem;">We typically respond within 12-24 hours.</p>
  </div>
</div>
<footer>&copy; 2025 Copenny.ai. All rights reserved.</footer>
</body>
</html>
